<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cfdns · 本地 DNS 管理</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2329; --muted: #6b7280;
    --line: #e5e7eb; --brand: #f6821f; --brand-ink: #fff;
    --orange: #f6821f; --gray: #6b7280; --green: #16a34a; --red: #dc2626;
    --amber: #d97706; --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink); }

  /* ───── 顶栏 (全宽) ───── */
  header { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
           background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  header h1 { font-size: 16px; margin: 0; }
  .grow { flex: 1; }

  /* ───── 状态条 ───── */
  #statusbar { flex: 0 0 auto; display: none; padding: 7px 16px; font-size: 13px;
               border-bottom: 1px solid var(--line); }
  #statusbar.ok { display: block; background: #f0fdf4; color: var(--green); border-color: #bbf7d0; }
  #statusbar.err { display: block; background: #fef2f2; color: var(--red); border-color: #fecaca; }
  #statusbar.info { display: block; background: #eff6ff; color: var(--blue); border-color: #bfdbfe; }

  /* ───── 主体: 左导航 + 右内容 ───── */
  .body { flex: 1 1 auto; display: flex; min-height: 0; }
  .sidebar { flex: 0 0 234px; overflow: auto; border-right: 1px solid var(--line);
             background: var(--panel); padding: 10px; }
  .side-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13px; }
  .nav-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px;
              cursor: pointer; font-size: 13px; color: var(--ink); border: 1px solid transparent; margin-bottom: 2px; }
  .nav-item:hover { background: var(--bg); border-color: var(--line); }
  .nav-item.active { background: #fff7ed; border-color: #fed7aa; }
  .nav-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .nav-ssl { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .nav-dot { min-width: 16px; height: 16px; border-radius: 999px; font-size: 10px; display: inline-flex;
             align-items: center; justify-content: center; color: #fff; padding: 0 4px; }
  .nav-dot.red { background: var(--red); }
  .nav-dot.amber { background: var(--amber); }

  .content { flex: 1 1 auto; overflow: auto; min-width: 0; padding: 16px; }

  /* ───── 通用组件 ───── */
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px;
         padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .btn:hover:not(:disabled) { border-color: var(--brand); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .btn.danger { color: var(--red); border-color: #fecaca; }
  .btn.danger:hover:not(:disabled) { background: #fef2f2; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
           font-size: 12px; border: 1px solid var(--line); background: #fff; }
  .badge.orange { color: var(--orange); border-color: #fed7aa; background: #fff7ed; }
  .badge.gray { color: var(--gray); }
  .badge.green { color: var(--green); border-color: #bbf7d0; background: #f0fdf4; }
  .badge.red { color: var(--red); border-color: #fecaca; background: #fef2f2; }
  .badge.amber { color: var(--amber); border-color: #fde68a; background: #fffbeb; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }

  .zone { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .zone > .zhead { background: #fafafa; padding: 10px 12px; display: flex; align-items: center; gap: 10px;
                   border-bottom: 1px solid var(--line); cursor: pointer; }
  .zone.collapsed > .zhead { border-bottom: none; }
  .zone.collapsed .zbody { display: none; }
  .toggle { width: 18px; text-align: center; color: var(--muted); font-size: 12px; user-select: none; }
  .zbody { padding: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  input, select { font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px;
                  width: 100%; background: #fff; }
  td.c-proxy, td.c-ssl, td.c-ttl, td.c-del { width: 92px; }
  td.c-type { width: 94px; }
  td.c-name { width: 140px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); }
  .pill.orange { color: var(--orange); border-color: #fed7aa; background: #fff7ed; }
  .pill.gray { color: var(--gray); }
  .row-del { color: var(--red); cursor: pointer; border: none; background: none; font-size: 16px; }
  .add-row { margin-top: 8px; }
  .err { color: var(--red); background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 12px; }
  .ok { color: var(--green); }
  .muted { color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .confirm-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 12px; }
  .confirm-box ul { margin: 8px 0; padding-left: 18px; }
  .confirm-box li { margin: 3px 0; }
  .banner { border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
  .banner.ok { background: #f0fdf4; color: var(--green); border: 1px solid #bbf7d0; }
  .banner.err { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--ink); color: #fff;
           padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: .95; }

  /* ───── 底部声明 (全宽) ───── */
  footer { flex: 0 0 auto; text-align: center; padding: 8px 16px; font-size: 12px;
           color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }

  /* ───── 模态框 ───── */
  #modalMask { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none;
               z-index: 100; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
  #modalMask.show { display: flex; }
  #modalBox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
              width: min(900px, 100%); max-height: calc(100vh - 80px); display: flex; flex-direction: column;
              box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal-head { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 15px; }
  .modal-body { flex: 1 1 auto; overflow: auto; padding: 16px 18px; min-height: 0; }
  .modal-foot { flex: 0 0 auto; display: flex; gap: 10px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); }

  .diff { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; white-space: pre-wrap; }
  .diff .del { color: var(--red); }
  .diff .add { color: var(--green); }
  .diff .ssl { color: var(--amber); }
  .diff .drift { color: var(--red); background: #fef2f2; padding: 2px 6px; border-radius: 4px; }
  .diff .zone-title { color: var(--muted); margin-top: 8px; }

  /* ───── 版本历史 ───── */
  .ver-row { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .ver-main { display: flex; flex-direction: column; gap: 2px; }
  .ver-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .ver-diff { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>cfdns <span class="muted" style="font-weight:400">本地 DNS 管理</span></h1>
  <span id="tok" class="badge gray">token: …</span>
  <span id="ver" class="badge gray">v…</span>
  <span id="drift" class="badge green">漂移: 无</span>
  <span id="applied" class="badge gray">上次推送: —</span>
  <span class="grow"></span>
  <button class="btn" id="btnVersions">版本</button>
  <button class="btn" id="btnPull">拉取</button>
  <button class="btn" id="btnPlan">预览</button>
  <button class="btn primary" id="btnApply">应用</button>
</header>

<div id="statusbar"></div>

<div class="body">
  <aside class="sidebar">
    <div class="side-head">
      <strong>域名</strong>
      <span class="grow"></span>
      <button class="btn sm" onclick="toggleAll(false)">展开</button>
      <button class="btn sm" onclick="toggleAll(true)">折叠</button>
    </div>
    <nav id="sidebarNav"></nav>
  </aside>

  <main class="content">
    <div class="panel">
      <h2>配置（可编辑）
        <span class="muted" style="font-weight:400">修改后点「预览」「应用」会自动保存</span>
        <button class="btn" id="btnSave" style="margin-left:auto">仅保存配置</button>
      </h2>
      <div id="editor"></div>
    </div>
  </main>
</div>

<footer id="footer">Generated by cfdns</footer>

<div class="toast" id="toast"></div>

<!-- 模态框容器 -->
<div id="modalMask">
  <div id="modalBox">
    <div class="modal-head"><h3 id="modalTitle">—</h3><span class="grow"></span><button class="btn sm" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script>
const TYPE_OPTS = ["A","AAAA","CNAME","MX","TXT","NS","SRV","CAA","PTR"];
const SSL_OPTS = ["","off","flexible","full","full_strict"];
let boot = null;          // GET /api/config 的数据
let editor = null;        // 可编辑配置副本
let plan = null;          // 最新 plan 结果
let pending = [];         // plan 中的待删除项(模态框内确认)
let collapsedSet = new Set();
let activeZone = -1;
let versionsCache = {};   // 版本列表缓存, 按 id 索引

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function esc(s){ return (s??"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setStatus(msg, kind){ const s=document.getElementById('statusbar'); s.textContent=msg; s.className=kind||'info'; }

async function api(path, method='GET', body){
  const opt = { method, headers:{} };
  if(body!==undefined){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const r = await fetch(path, opt);
  let data=null; try{ data=await r.json(); }catch(e){}
  return { status:r.status, data };
}

async function withBusy(label, fn){
  const btns=[document.getElementById('btnPull'),document.getElementById('btnPlan'),document.getElementById('btnApply'),document.getElementById('btnSave'),document.getElementById('btnVersions')];
  btns.forEach(b=>b.disabled=true);
  setStatus('处理中: '+label+' …', 'info');
  try { await fn(); }
  catch(e){ setStatus('请求异常: '+e.message, 'err'); }
  finally {
    btns.forEach(b=>b.disabled=false);
  }
}

// ───────────────── 模态框 ─────────────────
function openModal(title, bodyHTML, footHTML){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  document.getElementById('modalFoot').innerHTML = footHTML;
  document.getElementById('modalMask').classList.add('show');
}
function closeModal(){ document.getElementById('modalMask').classList.remove('show'); }
document.getElementById('modalMask').addEventListener('click', e=>{ if(e.target.id==='modalMask') closeModal(); });

// ───────────────── 启动 ─────────────────
async function boot_(){
  const {data} = await api('/api/config');
  boot = data;
  editor = JSON.parse(JSON.stringify(data.config||{zones:[]}));
  if(!editor.zones) editor.zones=[];
  renderHeader();
  renderEditor();
  renderSidebar();
  updateFooter();
}

function renderHeader(){
  const tok = document.getElementById('tok');
  tok.textContent = 'token: ' + (boot.has_token? '已配置' : '缺失');
  tok.className = 'badge ' + (boot.has_token? 'green' : 'red');
  document.getElementById('ver').textContent = 'v' + (boot.version||'?');
  const d = boot.drift||[];
  const db = document.getElementById('drift');
  if(d.length){ db.textContent='漂移: '+d.length+' 处'; db.className='badge red'; }
  else { db.textContent='漂移: 无'; db.className='badge green'; }
  const a = boot.applied;
  const ap = document.getElementById('applied');
  if(a && a.generated_at){ ap.textContent='上次推送: '+a.version+' · '+a.generated_at.slice(0,19).replace('T',' '); ap.className='badge gray'; }
  else { ap.textContent='上次推送: —'; ap.className='badge gray'; }
}

function updateFooter(){
  const v = (boot&&boot.version)||'?';
  document.getElementById('footer').textContent = 'Generated by cfdns · v'+v+' · 本地界面，数据来自 ~/.config/cfdns';
}

function renderEditor(){
  const root = document.getElementById('editor');
  if(!editor.zones.length){ root.innerHTML = '<p class="muted">配置为空。可在 <code>config.yaml</code> 中填写域名与解析，或点击「新增域名」。</p>'; }
  root.innerHTML = editor.zones.map((z,zi)=>zoneHTML(z,zi)).join('') + '<button class="btn add-row" onclick="addZone()">+ 新增域名</button>';
}

function zoneHTML(z, zi){
  const collapsed = collapsedSet.has(zi);
  const sslOpts = SSL_OPTS.map(o=>`<option value="${o}" ${z.ssl===o?'selected':''}>${o||'(默认)'}`) .join('');
  const recs = (z.records||[]).map((r,ri)=>{
    const typeOpts = TYPE_OPTS.map(t=>`<option value="${t}" ${(r.type||'').toUpperCase()===t?'selected':''}>${t}</option>`).join('');
    const sslOptsR = SSL_OPTS.map(o=>`<option value="${o}" ${(r.ssl||'')===o?'selected':''}>${o||'—'}</option>`).join('');
    return `<tr>
      <td class="c-name"><input value="${esc(r.name)}" onchange="setRec(${zi},${ri},'name',this.value)"></td>
      <td class="c-type"><select onchange="setRec(${zi},${ri},'type',this.value)">${typeOpts}</select></td>
      <td><input value="${esc(r.content)}" onchange="setRec(${zi},${ri},'content',this.value)"></td>
      <td class="c-ttl"><input type="number" value="${r.ttl||1}" onchange="setRec(${zi},${ri},'ttl',+this.value)"></td>
      <td class="c-proxy"><select onchange="setRec(${zi},${ri},'proxy',this.value==='true')"><option value="true" ${r.proxy?'selected':''}>橙云</option><option value="false" ${!r.proxy?'selected':''}>灰云</option></select></td>
      <td class="c-ssl"><select onchange="setRec(${zi},${ri},'ssl',this.value)">${sslOptsR}</select></td>
      <td><input value="${esc(r.comment)}" placeholder="备注" onchange="setRec(${zi},${ri},'comment',this.value)"></td>
      <td class="c-del"><button class="row-del" title="从配置移除（预览时会列为待删除）" onclick="delRec(${zi},${ri})">✕</button></td>
    </tr>`;
  }).join('');
  return `<div class="zone ${collapsed?'collapsed':''}" id="zone-${zi}">
    <div class="zhead" onclick="onZoneHead(event,${zi})">
      <span class="toggle">${collapsed?'▸':'▾'}</span>
      <input style="width:200px;font-weight:600" value="${esc(z.domain)}" onchange="setZone(${zi},'domain',this.value)" placeholder="域名 example.com" onclick="event.stopPropagation()">
      <label class="muted" onclick="event.stopPropagation()">Zone SSL <select onchange="setZone(${zi},'ssl',this.value)">${sslOpts}</select></label>
      <span class="muted">${(z.records||[]).length} 条</span>
      <span class="grow"></span>
      <button class="btn" onclick="event.stopPropagation();addRec(${zi})">+ 记录</button>
      <button class="btn danger" onclick="event.stopPropagation();delZone(${zi})">删除域名</button>
    </div>
    <div class="zbody">
      <table>
        <thead><tr><th>名称</th><th>类型</th><th>内容</th><th>TTL</th><th>代理</th><th>按主机SSL</th><th>备注</th><th></th></tr></thead>
        <tbody>${recs || '<tr><td colspan="8" class="muted">无记录</td></tr>'}</tbody>
      </table>
    </div>
  </div>`;
}

function onZoneHead(e, zi){ if(e.target.closest('input,select,button')) return; toggleZone(zi); }
function toggleZone(zi){ if(collapsedSet.has(zi)) collapsedSet.delete(zi); else collapsedSet.add(zi); renderEditor(); }
function toggleAll(collapse){ if(collapse) editor.zones.forEach((_,i)=>collapsedSet.add(i)); else collapsedSet.clear(); renderEditor(); }
function gotoZone(zi){
  activeZone = zi; collapsedSet.delete(zi); renderEditor(); renderSidebar();
  const el = document.getElementById('zone-'+zi);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderSidebar(){
  const sb = document.getElementById('sidebarNav');
  if(!editor.zones || !editor.zones.length){ sb.innerHTML='<p class="muted" style="font-size:12px">配置为空</p>'; return; }
  const driftBy = {}; (boot&&boot.drift||[]).forEach(d=>{ driftBy[d.domain]=(driftBy[d.domain]||0)+1; });
  const delBy = {}; pending.forEach(p=>{ delBy[p.domain]=(delBy[p.domain]||0)+1; });
  sb.innerHTML = editor.zones.map((z,i)=>{
    const drift = driftBy[z.domain]||0;
    const dels = delBy[z.domain]||0;
    return `<div class="nav-item ${i===activeZone?'active':''}" onclick="gotoZone(${i})">
      <span class="nav-name">${esc(z.domain||'(未命名)')}</span>
      ${z.ssl?`<span class="nav-ssl">${esc(z.ssl)}</span>`:''}
      ${drift?`<span class="nav-dot red" title="漂移 ${drift} 处">!</span>`:''}
      ${dels?`<span class="nav-dot amber" title="${dels} 条待删除">${dels}</span>`:''}
    </div>`;
  }).join('');
}

function setZone(zi,k,v){ editor.zones[zi][k]=v; renderSidebar(); }
function setRec(zi,ri,k,v){ editor.zones[zi].records[ri][k]=v; }
function addZone(){ editor.zones.push({domain:'',ssl:'',records:[]}); collapsedSet.delete(editor.zones.length-1); renderEditor(); renderSidebar(); }
function delZone(zi){ editor.zones.splice(zi,1); renderEditor(); renderSidebar(); }
function addRec(zi){ editor.zones[zi].records = editor.zones[zi].records||[]; editor.zones[zi].records.push({name:'',type:'A',content:'',proxy:false,ttl:1,comment:''}); renderEditor(); }
function delRec(zi,ri){ editor.zones[zi].records.splice(ri,1); renderEditor(); }

async function saveConfig(){
  const {status,data} = await api('/api/config','PUT',editor);
  if(status!==200){ setStatus('保存失败: '+(data&&data.error||status), 'err'); return false; }
  return true;
}

function showWarn(msg){ setStatus(msg, 'err'); }

// ───────────────── 变更 diff 渲染 ─────────────────
function changeLineHTML(c){
  if(c.action==='delete'){ return `<span class="del">  - ${esc(c.type)} ${esc(c.name)} (${esc(c.old)}) ${c.proxied?'[橙云]':''}</span>\n`; }
  if(c.action==='create'){
    if(c.field){ return `  <span class="add">${esc(c.field)}</span>\n`; }
    return `<span class="add">  + ${esc(c.type)} ${esc(c.name)} (${esc(c.new)}) ${c.proxied?'[橙云]':''}</span>\n`;
  }
  if(c.action==='update'){
    const detail = c.field || `内容 ${c.old} → ${c.new}`;
    return `<span class="add">  ~ ${esc(c.type)} ${esc(c.name)}: ${esc(detail)} ${c.proxied?'[橙云]':''}</span>\n`;
  }
  if(c.action==='ssl-zone'){ return c.field? `<span class="ssl">  ${esc(c.field)}</span>\n` : ''; }
  if(c.action==='ssl-host'){ return `<span class="ssl">  · 按主机SSL ${esc(c.name)}: ${esc(c.old)} → ${esc(c.new)}</span>\n`; }
  return `  ${esc(c.action)} ${esc(c.name)}: ${esc(c.old)} → ${esc(c.new)}\n`;
}

// 渲染整份 diff 为字符串, 并收集待删除项到 pending
function buildDiffHTML(res){
  pending = [];
  if(!res || !res.zones){ return '<p class="muted">无数据</p>'; }
  let html = '';
  for(const z of res.zones){
    html += `<div class="diff"><span class="zone-title">■ ${esc(z.domain)}</span>\n`;
    if(z.drift && z.drift.length){
      html += `<span class="drift">⚠ 线上自上次推送后被外部改动 ${z.drift.length} 处（已基于最新现状重新对账）:</span>\n`;
      for(const d of z.drift){ html += `<span class="drift">  · ${esc(d.type||z.domain)} ${esc(d.name)}: ${esc(d.old)} → ${esc(d.new)}</span>\n`; }
    }
    if(z.ssl_changed){ html += `<span class="ssl">  Zone SSL: ${esc(z.ssl_from)} → ${esc(z.ssl_to)}</span>\n`; }
    for(const c of (z.changes||[])){
      if(c.action==='delete'){ pending.push({id:c.id, domain:c.domain, type:c.type, name:c.name, old:c.old, checked:false}); }
      html += changeLineHTML(c);
    }
    if(z.host_ssl_rules||z.host_ssl_other){ html += `  · 按主机SSL: ${z.host_ssl_rules} 条规则（保留其他用户规则 ${z.host_ssl_other} 条）\n`; }
    if(!z.changed && (!z.drift||!z.drift.length)){ html += `  (无需变更)\n`; }
    if(z.has_error){ html += `  <span class="del">!! 该域名处理出错</span>\n`; }
    html += `</div>`;
  }
  return html;
}

function countChanges(res){
  let n=0;
  for(const z of (res.zones||[])) n += (z.changes||[]).length + (z.drift||[]).length;
  return n;
}

// ───────────────── 预览 / 应用 模态框 ─────────────────
async function openPreviewModal(){
  await withBusy('预览变更', async ()=>{
    if(!await saveConfig()) return;
    const {status,data} = await api('/api/plan','POST');
    if(status!==200){ openModal('预览失败', '<div class="err">'+esc(data&&data.error||status)+'</div>', '<button class="btn" onclick="closeModal()">关闭</button>'); return; }
    plan = data;
    renderPreviewModal(data);
  });
}

function renderPreviewModal(res){
  const diffHTML = buildDiffHTML(res);
  let confirmHTML = '';
  if(pending.length){
    confirmHTML = `<div class="confirm-box" style="margin-top:14px">
      <strong>⚠️ 以下记录将解绑（删除） — 此操作不可自动恢复：</strong>
      <ul>${pending.map((p,i)=>`<li><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-i="${i}" onchange="togglePending(${i},this.checked)" style="width:auto"> ${esc(p.type)} ${esc(p.name)} — ${esc(p.old)}</label></li>`).join('')}</ul>
      <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="confirmAll" onchange="toggleAllPending(this.checked)" style="width:auto"> 我已逐条确认以上记录可删除（未勾选的记录本次不会删除）</label>
    </div>`;
  }
  const n = countChanges(res);
  const foot = `<button class="btn" onclick="closeModal()">取消</button>
    <button class="btn primary" id="modalApplyBtn" ${pending.length?'disabled':''} onclick="applyFromModal()">应用到 Cloudflare${n?('（'+n+' 处）'):''}</button>`;
  openModal('预览 · 变更 '+n+' 处'+(res.drift_detected?' · 漂移已重对账':''), diffHTML + confirmHTML, foot);
  updateModalApplyBtn();
}

function togglePending(i,v){ pending[i].checked=v; renderModalConfirmChecks(); }
function toggleAllPending(v){ pending.forEach(p=>p.checked=v); renderModalConfirmChecks(); }
function renderModalConfirmChecks(){
  pending.forEach((p,i)=>{ const cb=document.querySelector('#modalBody input[data-i="'+i+'"]'); if(cb) cb.checked=p.checked; });
  const all = pending.length>0 && pending.every(p=>p.checked);
  const ca = document.getElementById('confirmAll'); if(ca) ca.checked=all;
  updateModalApplyBtn();
}
function updateModalApplyBtn(){
  const btn = document.getElementById('modalApplyBtn');
  if(!btn) return;
  btn.disabled = pending.length>0 && !pending.every(p=>p.checked);
}

async function applyFromModal(){
  if(pending.length && !pending.every(p=>p.checked)){ return; }
  const btn = document.getElementById('modalApplyBtn'); if(btn) btn.disabled=true;
  await withBusy('应用变更', async ()=>{
    const ids = pending.filter(p=>p.checked).map(p=>p.id);
    const {status,data} = await api('/api/apply','POST',{delete_ids:ids, delete_extra:false, confirmed:true});
    if(status===409){
      openModal('应用被拦截', '<div class="err">存在未确认的待删除记录，请返回逐条确认。</div>', '<button class="btn" onclick="closeModal()">关闭</button>');
      return;
    }
    if(status!==200){ openModal('应用失败', '<div class="err">'+esc(data&&data.error||status)+'</div>', '<button class="btn" onclick="closeModal()">关闭</button>'); return; }
    closeModal();
    setStatus('应用完成，已写入基线并保存版本快照'+(data.drift_detected?'；检测到漂移并已重新对账':''),'ok');
    toast('已应用');
    await boot_();
  });
}

// ───────────────── 版本历史 / 回退 ─────────────────
async function openVersionsModal(){
  const {status,data} = await api('/api/versions');
  if(status!==200){ openModal('版本历史', '<div class="err">'+esc(data&&data.error||status)+'</div>', '<button class="btn" onclick="closeModal()">关闭</button>'); return; }
  const vs = data||[];
  versionsCache = {}; vs.forEach(v=>versionsCache[v.id]=v);
  let body = '';
  if(!vs.length){ body = '<p class="muted">暂无版本。每次成功「应用」都会在此保存一份版本快照，可查看变更记录、并回退到任意历史版本。</p>'; }
  else { body = vs.map(verRowHTML).join(''); }
  openModal('版本历史（'+vs.length+'）', body, '<button class="btn" onclick="closeModal()">关闭</button>');
}

function verRowHTML(v){
  const t = (v.time||'').replace('T',' ').slice(0,19);
  const drift = v.drift ? '<span class="badge red">漂移</span>' : '';
  const diffCount = Array.isArray(v.diff)? v.diff.length : 0;
  return `<div class="ver-row" data-id="${esc(v.id)}">
    <div class="ver-main">
      <div><strong>${esc(v.id)}</strong> <span class="muted">${esc(t)}</span> ${drift}</div>
      <div class="muted">${esc(v.summary||'')} · app ${esc(v.app_ver||'?')} · 变更 ${diffCount} 条 · ${(v.zones||[]).length} 个域名</div>
    </div>
    <div class="ver-actions">
      <button class="btn sm" onclick="toggleVerDiff('${esc(v.id)}')">查看变更</button>
      <button class="btn sm" onclick="confirmRollback('${esc(v.id)}')">回退到此版本</button>
    </div>
    <div class="ver-diff" id="verdiff-${esc(v.id)}" style="display:none"></div>
  </div>`;
}

function toggleVerDiff(id){
  const el = document.getElementById('verdiff-'+id);
  if(el.style.display!=='none'){ el.style.display='none'; return; }
  const v = versionsCache[id];
  const diff = (v&&v.diff)||[];
  let html = diff.length ? diff.map(changeLineHTML).join('') : '<p class="muted">无变更记录</p>';
  el.innerHTML = '<div class="diff" style="margin-top:8px">'+html+'</div>';
  el.style.display='block';
}

function confirmRollback(id){
  const v = versionsCache[id];
  openModal('回退到版本 '+id,
    `<p>将把本地配置 <code>config.yaml</code> 恢复为该版本记录的线上状态（共 ${(v.zones||[]).length} 个域名、${Array.isArray(v.diff)?v.diff.length:0} 条变更）。</p>
     <p class="muted">恢复后请点「预览」核对差异，再「应用」推回 Cloudflare。此操作只修改本地配置，不会立即改动线上。</p>`,
    `<button class="btn" onclick="closeModal()">取消</button>
     <button class="btn danger" onclick="doRollback('${esc(id)}')">确认恢复配置</button>`);
}

async function doRollback(id){
  const {status,data} = await api('/api/versions/'+id+'/restore','POST');
  if(status!==200){ openModal('回退失败', '<div class="err">'+esc(data&&data.error||status)+'</div>', '<button class="btn" onclick="closeModal()">关闭</button>'); return; }
  closeModal();
  setStatus('已恢复配置到版本 '+id+'，请预览并应用', 'ok');
  toast('已恢复到 '+id);
  await boot_();
}

// ───────────────── 拉取 / 保存 ─────────────────
async function doPull(){
  await withBusy('拉取线上现状', async ()=>{
    const {status,data}=await api('/api/pull','POST');
    if(status!==200){ showWarn('拉取失败: '+(data&&data.error||status)); return; }
    toast('已拉取 '+(data.zones||0)+' 个域名');
    setStatus('已拉取 '+ (data.zones||0) +' 个域名的线上现状', 'ok');
    await boot_();
  });
}

document.getElementById('btnPull').onclick = doPull;
document.getElementById('btnPlan').onclick = openPreviewModal;
document.getElementById('btnApply').onclick = openPreviewModal;   // 应用也走「预览 + 模态框内确认」
document.getElementById('btnVersions').onclick = openVersionsModal;
document.getElementById('btnSave').onclick = async ()=>{ await withBusy('保存配置', async ()=>{ if(await saveConfig()){ setStatus('配置已保存','ok'); toast('配置已保存'); } }); };

boot_();
</script>
</body>
</html>
